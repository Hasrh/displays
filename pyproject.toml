[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-companion-display"
version = "0.1.0"
description = "Host-authoritative desktop companion display"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Desktop Companion Display contributors" }]
dependencies = [
  "numpy>=2.4.3,<2.5",
  "websockets>=16.1.1,<17",
]

[project.optional-dependencies]
host = [
  "psutil>=7.2.2,<8",
]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.5",
  "types-psutil>=7.2.2.20260518",
]

[project.scripts]
desktop-display-host = "pc.main:main"
desktop-display-pi = "pi.main:main"

[tool.setuptools.packages.find]
include = ["pc*", "pi*", "shared*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["pc", "pi", "shared", "scripts"]
