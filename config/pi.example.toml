[application]
log_level = "INFO"

[host]
# Fixed Windows address on the direct USB Ethernet link.
url = "ws://192.168.7.1:8765"

[display]
# Verified on LCDWiki MPI3501 with dtoverlay=tft35a:rotate=90.
backend = "framebuffer"
device = "/dev/fb1"
controller = "ili9486"
pixel_format = "rgb565"
# fbset reports 480x320 after the kernel applies the 90-degree rotation.
width = 480
height = 320
orientation = 90
target_fps = 25

# Touch is intentionally disabled for now. Add this section when it is implemented:
# [touch]
# controller = "xpt2046"
