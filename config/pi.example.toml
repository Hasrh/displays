[application]
log_level = "INFO"

[host]
# Use the reserved Windows Wi-Fi address.
url = "ws://192.168.1.10:8765"

[network]
client_id = "display-pi"
auth_token_env = "DESKTOP_DISPLAY_TOKEN"
reconnect_initial_seconds = 1.0
reconnect_max_seconds = 30.0
handshake_timeout_seconds = 10

[display]
# Verified on LCDWiki MPI3501 with dtoverlay=tft35a:rotate=90.
backend = "framebuffer"
device = "/dev/fb1"
controller = "ili9486"
pixel_format = "rgb565"
# fbset reports 480x320 after the kernel applies the 90-degree rotation.
width = 480
height = 320
orientation = 90
target_fps = 25

# Touch is intentionally disabled for now. Add this section when it is implemented:
# [touch]
# controller = "xpt2046"
