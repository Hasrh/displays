[application]
log_level = "INFO"

[server]
# Reserve this address for the Windows Wi-Fi adapter in your router.
bind_host = "192.168.1.10"
port = 8765

[network]
auth_token_env = "DESKTOP_DISPLAY_TOKEN"
heartbeat_interval_seconds = 5
client_timeout_seconds = 15

[collectors.system]
enabled = true
interval_seconds = 1.0

[collectors.librehardwaremonitor]
# Start LibreHardwareMonitor as administrator and enable Options > Remote Web Server > Run.
enabled = true
url = "http://127.0.0.1:8085/data.json"
timeout_seconds = 1.0

[collectors.media]
# Reads the active Windows Global System Media Transport Controls session.
enabled = true
interval_seconds = 1.0

[collectors.fft]
# Captures default speaker output through WASAPI loopback and streams 64 FFT bins.
enabled = true
fft_size = 2048

# The token itself comes from the named environment variable; never commit it.
